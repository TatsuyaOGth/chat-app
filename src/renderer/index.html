<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/github-dark.min.css" />
  </head>
  <body>
    <div id="app">
      <!-- Left pane: session list (Phase 3 will populate it) + settings button -->
      <aside id="left-pane">
        <button
          id="left-pane-toggle"
          class="pane-toggle"
          type="button"
          title="サイドバーを折りたたむ"
          aria-label="サイドバーを折りたたむ"
        >◀</button>

        <div class="pane-header">
          <h1 class="app-title">Chat App</h1>
        </div>

        <div class="pane-actions">
          <button id="new-session-btn" class="btn btn-secondary">＋ 新規セッション</button>
        </div>

        <div id="session-list" class="session-list" aria-label="セッション一覧">
          <!-- Populated by renderer.js -->
        </div>

        <div class="pane-footer">
          <button
            id="settings-btn"
            class="icon-btn"
            title="設定"
            aria-label="設定"
          >
            ⚙
          </button>
        </div>
      </aside>

      <!-- Center pane: chat area -->
      <main id="center-pane">
        <div id="messages" role="log" aria-label="チャットメッセージ" aria-live="polite"></div>

        <form id="input-form" class="input-form" autocomplete="off">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="メッセージを入力… (Enter で送信、Shift+Enter で改行)"
            rows="3"
            aria-label="メッセージ入力"
          ></textarea>
          <label
            id="raw-request-toggle-wrap"
            for="raw-request-toggle"
            class="search-toggle"
            title="リクエスト全文（JSON）を直接送信する"
            aria-label="リクエスト全文（JSON）を直接送信する"
          >
            <input id="raw-request-toggle" class="search-toggle__input" type="checkbox" />
            <span class="search-toggle__icon" aria-hidden="true">{ }</span>
          </label>
          <label
            id="web-search-toggle-wrap"
            for="web-search-toggle"
            class="search-toggle"
            title="ウェブ検索を有効にする"
            aria-label="ウェブ検索を有効にする"
            hidden
          >
            <input id="web-search-toggle" class="search-toggle__input" type="checkbox" />
            <span class="search-toggle__icon" aria-hidden="true">🌐</span>
          </label>
          <label
            id="reasoning-toggle-wrap"
            for="reasoning-toggle"
            class="search-toggle"
            title="推論を行う"
            aria-label="推論を行う"
          >
            <input id="reasoning-toggle" class="search-toggle__input" type="checkbox" checked />
            <span class="search-toggle__icon" aria-hidden="true">🧠</span>
          </label>
          <button id="send-btn" type="submit" class="btn btn-primary" disabled>送信</button>
          <button id="cancel-btn" type="button" class="btn btn-secondary" style="display:none" aria-label="生成を停止">停止</button>
        </form>

        <div id="status-bar" class="status-bar" aria-live="polite"></div>
      </main>

      <!-- Right pane: preset selector + parameter editor -->
      <aside id="right-pane">
        <button
          id="right-pane-toggle"
          class="pane-toggle"
          type="button"
          title="サイドバーを折りたたむ"
          aria-label="サイドバーを折りたたむ"
        >▶</button>

        <div class="pane-header">
          <label for="preset-select" class="label">プリセット</label>
          <select id="preset-select" class="select">
            <option value="">（新規 / 未保存）</option>
          </select>
        </div>

        <div id="param-editor" class="param-editor" aria-label="パラメータ編集">
          <!-- Parameter rows are rendered by params.js -->
        </div>

        <div class="pane-footer preset-actions">
          <input
            id="preset-name-input"
            class="preset-name-input"
            type="text"
            placeholder="プリセット名"
            maxlength="80"
            aria-label="プリセット名"
          />
          <div class="preset-btn-row">
            <button id="save-preset-btn" type="button" class="btn btn-secondary" disabled>上書き保存</button>
            <button id="new-preset-btn" type="button" class="btn btn-secondary">新規保存</button>
          </div>
        </div>
      </aside>

      <!-- Resizable dividers -->
      <div id="left-divider" class="pane-divider"></div>
      <div id="right-divider" class="pane-divider"></div>
    </div>

    <!-- Settings modal -->
    <dialog id="settings-modal" class="settings-modal" aria-label="設定">
      <form method="dialog" class="settings-modal__inner">
        <header class="settings-modal__header">
          <h2 class="settings-modal__title">⚙ 設定</h2>
          <button
            type="button"
            id="settings-close-btn"
            class="icon-btn"
            title="閉じる"
            aria-label="閉じる"
          >
            ×
          </button>
        </header>

        <section class="settings-section">
          <h3 class="settings-section__heading">プリセット管理</h3>
          <p class="settings-section__hint">
            ドラッグ＆ドロップで並べ替えできます。
          </p>
          <ul id="settings-preset-list" class="preset-list" aria-label="プリセット一覧"></ul>
        </section>

        <section class="settings-section settings-section--ollama">
          <h3 class="settings-section__heading">Ollama 接続先</h3>
          <p class="settings-section__hint">
            LAN上の別マシンで動作している Ollama に接続できます。例: http://192.168.1.50:11434
          </p>

          <div class="ollama-settings">
            <label for="ollama-base-url-input" class="label">サーバーURL</label>
            <input
              id="ollama-base-url-input"
              class="ollama-settings__input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="http://localhost:11434"
              aria-label="Ollama サーバーURL"
            />
            <button id="ollama-base-url-save-btn" type="button" class="btn btn-secondary ollama-settings__save-btn">
              保存
            </button>
            <button id="ollama-base-url-reset-btn" type="button" class="btn btn-secondary ollama-settings__reset-btn">
              ローカルに戻す
            </button>
            <p id="ollama-base-url-status" class="ollama-settings__status" aria-live="polite"></p>
          </div>
        </section>

        <section class="settings-section settings-section--tavily">
          <h3 class="settings-section__heading">Tavily API Key</h3>
          <p class="settings-section__hint">
            入力して保存すると userData 配下の tavily-config.json を作成または上書きします。
          </p>

          <div class="tavily-settings">
            <label for="tavily-api-key-input" class="label">API Key</label>
            <input
              id="tavily-api-key-input"
              class="tavily-settings__input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="tvly-..."
              aria-label="Tavily API Key"
            />
            <button id="tavily-api-key-save-btn" type="button" class="btn btn-secondary tavily-settings__save-btn">
              保存
            </button>
            <button id="tavily-api-key-delete-btn" type="button" class="btn btn-danger tavily-settings__delete-btn">
              削除
            </button>
            <p id="tavily-api-key-status" class="tavily-settings__status" aria-live="polite"></p>
          </div>
        </section>
      </form>
    </dialog>

    <!-- Markdown & Syntax Highlighting -->
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/highlight.min.js"></script>

    <script src="params.js"></script>
    <script src="request-routing.js"></script>
    <script src="generation-lifecycle.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
