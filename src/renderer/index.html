<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Left pane: session list (Phase 3 will populate it) + settings button -->
      <aside id="left-pane">
        <div class="pane-header">
          <h1 class="app-title">Chat App</h1>
        </div>

        <div class="pane-actions">
          <button id="new-session-btn" class="btn btn-secondary">＋ 新規セッション</button>
        </div>

        <div id="session-list" class="session-list" aria-label="セッション一覧">
          <!-- Phase 3: session history rendered here -->
          <p class="hint">セッション履歴は Phase 3 で実装予定</p>
        </div>

        <div class="pane-footer">
          <button
            id="settings-btn"
            class="icon-btn"
            title="設定"
            aria-label="設定"
            disabled
          >
            ⚙
          </button>
        </div>
      </aside>

      <!-- Center pane: chat area -->
      <main id="center-pane">
        <div id="messages" role="log" aria-label="チャットメッセージ" aria-live="polite"></div>

        <form id="input-form" class="input-form" autocomplete="off">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="メッセージを入力… (Enter で送信、Shift+Enter で改行)"
            rows="3"
            aria-label="メッセージ入力"
          ></textarea>
          <button id="send-btn" type="submit" class="btn btn-primary" disabled>送信</button>
        </form>

        <div id="status-bar" class="status-bar" aria-live="polite"></div>
      </main>

      <!-- Right pane: template selector + parameter editor -->
      <aside id="right-pane">
        <div class="pane-header">
          <label for="template-select" class="label">テンプレート</label>
          <select id="template-select" class="select">
            <option value="">（新規 / 未保存）</option>
          </select>
        </div>

        <div id="param-editor" class="param-editor" aria-label="パラメータ編集">
          <!-- Parameter rows are rendered by params.js -->
        </div>

        <div class="pane-footer template-actions">
          <button id="save-template-btn" class="btn btn-secondary" disabled>上書き保存</button>
          <button id="new-template-btn" class="btn btn-secondary">新規テンプレート</button>
        </div>
      </aside>
    </div>

    <script src="params.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
